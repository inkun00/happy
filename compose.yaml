# 데모 스택: 먼저 루트에서 `npm run build`(VITE_API_URL 비우면 상대 `/api` → nginx 프록시).
# 웹 http://localhost:8080 · API 직접 http://localhost:8787
services:
  api:
    build: ./server
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      TRUST_PROXY: "1"
      SQLITE_PATH: /data/happy.sqlite
    volumes:
      - happy_sqlite:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  happy_sqlite:
